# Added only to mcopt/* release branches of forks. Builds the mod and publishes the jars
# as a GitHub Release when a tag like "2.0.4+mcopt.1" is pushed.
name: mcopt release

on:
  push:
    tags: ["*+mcopt.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Most 1.20.1 mods build on 17; set MCOPT_JAVA in the repo variables to override.
          java-version: ${{ vars.MCOPT_JAVA || '17' }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew ${{ vars.MCOPT_GRADLE_TASK || 'build' }} --no-daemon --stacktrace

      - name: Collect jars
        run: |
          mkdir -p dist
          # Remapped release jars only; skip sources/dev/javadoc jars.
          find . -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-dev-shadow.jar' ! -name '*-javadoc.jar' \
            ${{ vars.MCOPT_JAR_FILTER || '' }} -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: dist/*.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --title "$GITHUB_REF_NAME" \
            --notes-file MCOPT_CHANGES.md
